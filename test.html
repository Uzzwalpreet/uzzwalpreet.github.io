        const intervals = weatherData.data.timelines[0].intervals;
        const categories = intervals.map(interval => {
            const date = new Date(interval.startTime);
            return `${date.getUTCHours()}:00 ${date.getUTCDate()}-${date.getUTCMonth() + 1}`;
        });
        const temperatureData = intervals.map(interval => interval.values.temperature);
        const humidityData = intervals.map(interval => interval.values.humidity);
        const pressureData = intervals.map(interval => interval.values.pressureSeaLevel);
        const windSpeedData = intervals.map(interval => interval.values.windSpeed);
        const windDirectionData = intervals.map(interval => ({
            value: interval.values.windSpeed,
            direction: interval.values.windDirection
        }));

        Highcharts.chart('container', {
    chart: {
        zoomType: 'x'
    },
    title: {
        text: 'Hourly Weather (For Next 5 Days)'
    },
    xAxis: {
        categories: categories,
        crosshair: true,
        tickInterval: 6, // Force 6-hour intervals on the x-axis
        labels: {
            format: '{value}'
        }
    },
    yAxis: [{
        title: {
            text: 'Temperature (°F)'
        },
        opposite: false
    }, {
        title: {
            text: 'Air Pressure (inHg)'
        },
        opposite: true
    }],
    tooltip: {
        shared: true,
        useHTML: true,
        formatter: function () {
            let tooltip = `<b>${this.x}</b><br/>`;
            this.points.forEach(point => {
                if (point.series.name === 'Humidity') {
                    tooltip += `<span style="color:${point.series.color}">●</span> Humidity: <b>${point.y}%</b><br/>`;
                } else if (point.series.name === 'Pressure') {
                    tooltip += `<span style="color:${point.series.color}">●</span> Pressure: <b>${point.y}°F</b><br/>`;
                } else if (point.series.name === 'Air Pressure') {
                    tooltip += `<span style="color:${point.series.color}">●</span> Air Pressure: <b>${point.y} inHg</b><br/>`;
                } else if (point.series.name === 'Wind Direction') {
                    tooltip += `<span style="color:${point.series.color}">●</span> Wind Direction: <b>${point.y} mph</b><br/>`;
                }
            });
            return tooltip;
        }
    },
    series: [{
        name: 'Humidity',
        type: 'column',
        data: humidityData,
        tooltip: {
            valueSuffix: '%'
        },
        color: '#5db4ee',
        pointWidth: 15,  // Adjust thickness of the bars
        dataLabels: {
            enabled: true, // Enable data labels
            format: '{y}%', // Display the humidity percentage
            inside: false, // Set to false to display the label above the bar
            style: {
                fontWeight: 'bold', // Styling for data labels
                color: '#000' // Set color for visibility
            }
        }
        
    }, {
        name: 'Pressure',
        type: 'spline',
        data: temperatureData, // Assuming this was meant to be temperature
        tooltip: {
            valueSuffix: '°F'
        },
        color: '#f15c80'
    }, 
    {
        name: 'Air Pressure',
        type: 'spline',
        yAxis: 1,
        data: pressureData,
        tooltip: {
            valueSuffix: ' inHg'
        },
        color: '#ffa500',
        dashStyle: 'Dash',  // Dashed line for Air Pressure
        marker: {
            enabled: false // Disables marker for each point to avoid overcrowding
        },
        dataGrouping: {
            enabled: false // Disable data grouping for Air Pressure to use raw data
        }
    }, 
    {
        name: 'Wind Direction',
        type: 'windbarb',
        data: windDirectionData,
        tooltip: {
            valueSuffix: ' mph'
        },
        color: '#000',
        barbSize: 10,  // Adjust the barb size to avoid overlap
        yOffset: 10,  // Adjust the offset for better positioning
        dataGrouping: {
            enabled: false, // Disable data grouping for wind barbs
        }
    }]
});
